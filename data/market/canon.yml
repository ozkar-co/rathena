schemaVersion: 1
version: 2
updatedAt: "2026-11-18"
closedAt: "2026-11-18"
status: closed-v2

master:
  scope: all_items
  source_of_truth_spec: data/market/SPEC.md
  source_of_truth_decisions: data/market/canon.yml
  current_sample: data/market/samples/
  future_master: data/market/master.jsonl
  taxonomy_role: intermediate_input
  general_sample_population: marketEligible
  npc_market: all_items
  npc_history_multiplier: future_only

sources:
  drop_rates: conf/import/battle_conf.txt
  hp_rates: conf/import/battle_conf.txt
  spawns: tools/mob_spawns.py
  historical_prices: ragnabots/staging/market/pricing/master_list.json
  historical_prices_role: reference_only

supply:
  open_types: [field, dungeon]
  separate_types: [boss, instance, guild, quest, event, other]
  effective_hp: true
  high_hp_threshold: 10000000

pricing:
  statuses: [market, synthetic, manual, unknown]
  manual_prices:
    35001: 100000000
    35002: 10000000
    35003: 1000000
    35004: 100000
    35005: 500000
  synthetic_base: type_p40
  synthetic_cap: type_p90
  synthetic_gear_factor: "slots, attack+defense, equip level; clamped 0.70-2.00"
  synthetic_group_factor: "0.60 + 0.10 * (1 - bestGroupShare)"
  no_source_base_cap: 1000000
  no_source_formula: "min(type_p10, 1000000) * 0.50"
  npc_sell_formula: "max(buy * 1.10, min(mid * (1 + margin), buy * 1.50))"
  npc_sell_margin:
    market_high: 0.10
    market_medium: 0.20
    market_low: 0.30
    synthetic: 0.35
    manipulation: 0.50
    manual: 0.00
  synthetic_source_factors:
    group: 0.70
    craft: 0.90
    quest: 0.80
    instance: 0.80
    guild: 0.70
    unknown: 0.50
    none: 0.50
    normal: 1.00
    npc: 1.00
    cash: 1.00
  demand_combine: "LATAM and Atlantis residuals weighted by log1p(total_sold)"
  cash_shop: "tag and cashPrice only; no zeny conversion yet"
  composed: "data/market/components.yml + tools/market/valuation.py"
  buy_ceiling:
    synthetic: "45% of mid, capped at 50% of type median"
    market_high: "75% of mid"
    market_medium: "60% of mid, capped at type median"
    market_low: "45% of mid and 75% of low, capped at 50% of type median"
    manipulation: "35% of mid and 70% of low, capped at 50% of type median"

quality:
  manipulation_rules:
    - "atlantis cv > 3"
    - "outlier flag atlantis_extreme_max"
  review_queue: outliers, custom, no-source, restricted-access
  stock:
    pressure: "demandPercentile - supplyPercentile"
    stock_hint: "low if pressure > 25, high if pressure < -25, otherwise normal"
    restock_weight: "clamp(0.5 + pressure / 200, 0.1, 0.9)"
