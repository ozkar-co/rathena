schemaVersion: 1
updatedAt: "2026-11-18"
status: sample

master:
  scope: all_items
  source_of_truth: data/market/master.jsonl
  taxonomy_role: intermediate_input
  general_sample_population: marketEligible

sources:
  drop_rates: conf/import/battle_conf.txt
  hp_rates: conf/import/battle_conf.txt
  spawns: tools/mob_spawns.py
  historical_prices: ragnabots/staging/market/pricing/master_list.json
  historical_prices_role: reference_only

supply:
  open_types: [field, dungeon]
  separate_types: [boss, instance, guild, quest, event, other]
  effective_hp: true
  high_hp_threshold: 10000000

pricing:
  statuses: [market, synthetic, manual, unknown, not_applicable]
  synthetic_source_factors:
    group: 0.70
    craft: 0.90
    quest: 0.80
    instance: 0.80
    guild: 0.70
    unknown: 0.50
    none: 0.50
    normal: 1.00
    npc: 1.00
    cash: 1.00
  buy_ceiling:
    synthetic: "45% of mid, capped at 50% of type median"
    market_high: "75% of mid"
    market_medium: "60% of mid, capped at type median"
    market_low: "45% of mid and 75% of low, capped at 50% of type median"
    manipulation: "35% of mid and 70% of low, capped at 50% of type median"

quality:
  manipulation_rules:
    - "atlantis cv > 3"
    - "outlier flag atlantis_extreme_max"
  review_queue: outliers, custom, no-source, restricted-access
